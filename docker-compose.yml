# Dev convenience: just the Postgres database. Run the backend (uvicorn)
# and frontend (vite) directly on your machine against this.
#
#   docker compose up -d
#   cd backend  && pip install -r requirements.txt && cp .env.example .env  # fill in ANTHROPIC_API_KEY
#   uvicorn app.main:app --reload
#   cd frontend && npm install && npm run dev
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: vectorless
      POSTGRES_PASSWORD: vectorless_dev
      POSTGRES_DB: vectorless_rag
    ports:
      - "5432:5432"
    volumes:
      - vectorless_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectorless -d vectorless_rag"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vectorless_pg_data:
